apiVersion: v1
kind: ConfigMap
metadata:
  name: springboot-demo-config
  namespace: springboot-demo
  labels:
    app.kubernetes.io/name: springboot-demo
data:
  # Bound to app.data.* by Spring Boot relaxed binding (APP_DATA_NAME -> app.data.name).
  APP_DATA_NAME: springboot-demo
  APP_DATA_VALUE: deployed-by-jenkins
  APP_DATA_PLACE: amazon-eks
