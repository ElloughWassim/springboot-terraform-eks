apiVersion: v1
kind: Service
metadata:
  name: springboot-demo
  namespace: springboot-demo
  labels:
    app.kubernetes.io/name: springboot-demo
spec:
  # On EKS this provisions an AWS load balancer. Use ClusterIP + an Ingress in production.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: springboot-demo
  ports:
    - name: http
      port: 80
      targetPort: http
